name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject config into config.js
        env:
          SITE_HINT: ${{ secrets.SITE_HINT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          {
            echo "window.SITE_HINT   = '${SITE_HINT}';"
            echo "window.ADMIN_EMAIL = '${ADMIN_EMAIL}';"
            echo "window.PROXY_URL   = '${PROXY_URL}';"
          } > docs/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
